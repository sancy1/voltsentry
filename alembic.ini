# FILE: alembic.ini
# PATH: voltsentry/alembic.ini
# DESCRIPTION: Alembic configuration for database migrations

[alembic]
# Path to migration scripts directory
script_location = src/voltsentry/db/migrations
prepend_sys_path = .
version_path_separator = os

# Placeholder URL - dynamically set by env.py at runtime via voltsentry.core.constants.DB_PATH
sqlalchemy.url = sqlite:///%(DB_PATH)s

[post_write_hooks]
# Auto-format newly generated migration scripts
hooks = black
black.type = console
black.executable = black
black.options = -l 80

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers = console
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers = console
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S