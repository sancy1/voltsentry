
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voltsentry"
version = "1.0.0"
description = "Intelligent Battery Health Management System"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
authors = [
    {name = "Your Company Name", email = "info@voltsentry.com"}
]
keywords = ["battery", "health", "management", "monitoring", "desktop"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Topic :: System :: Monitoring",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "PyQt6>=6.5.0",
    "psutil>=5.9.0",
    "SQLAlchemy>=2.0.0",
    "alembic>=1.12.0",
    "tenacity>=8.2.0",
    "pygame>=2.5.0",
    "requests>=2.31.0",
    "cryptography>=41.0.0",
    "matplotlib>=3.7.0"
]

[project.urls]
Homepage = "https://voltsentry.com"
Repository = "https://github.com/yourcompany/voltsentry"
Documentation = "https://docs.voltsentry.com"

[project.optional-dependencies]
enterprise = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "pydantic>=2.0.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-mock>=3.11.0",
    "pytest-qt>=4.2.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "pre-commit>=3.5.0",
    "coverage>=7.3.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["voltsentry*"]
exclude = ["tests*", "docs*", "scripts*"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "C", "D"]
ignore = ["D100", "D104", "D107"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --strict-markers --tb=short"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests",
]